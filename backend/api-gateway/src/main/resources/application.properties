spring.application.name=api-gateway
server.port=${PORT:8080}

spring.cloud.gateway.server.webmvc.routes[0].id=user-service-businesses
spring.cloud.gateway.server.webmvc.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/businesses/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=Retry
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.retries=6
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.series=SERVER_ERROR
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.methods=GET
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.backoff.firstBackoff=5s
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.backoff.maxBackoff=10s
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.backoff.factor=1.5

